<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vector Rumble Editor</title>
  <meta name="description" content="Design your own Vector Rumble arenas and ships: draw walls, check them, and export files the game can play.">
  <meta name="theme-color" content="#0b0d12">
  <script>
    // Apply a saved theme before anything paints, so a light-theme visitor does not see a dark flash
    try { var t = JSON.parse(localStorage.getItem('vrumble-editor-settings') || '{}').theme; if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) { /* default */ }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Hanken+Grotesk:wght@400;500;600&display=swap">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/editor.css">
</head>
<body>
  <div class="banner" id="banner" role="alert" hidden></div>
  <div class="banner info" id="rotate-hint" hidden>
    <span>The editor has much more room with your phone turned sideways.</span>
    <span class="banner-buttons"><button id="rotate-dismiss" type="button">Not now</button></span>
  </div>

  <header class="bar">
    <h1 class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><path d="M16 3 27 28 16 22 5 28Z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/></svg>
      <b>Vector Rumble</b><span class="tag">Editor</span><i id="brand-version"></i>
    </h1>
    <nav class="tabs" role="tablist" aria-label="What to edit">
      <button type="button" role="tab" id="tab-levels" aria-selected="true">Arenas</button>
      <button type="button" role="tab" id="tab-ships" aria-selected="false">Ships</button>
    </nav>
    <div class="actions">
      <label class="button" for="open-file" title="Add arena or ship XML files to your library">Import XML</label>
      <input id="open-file" type="file" accept=".xml,text/xml,application/xml" multiple hidden>
      <button id="new-level" type="button">New</button>
      <button id="open-library" type="button">Library</button>
      <button id="checks-badge" type="button" class="checks-badge" disabled>No arena</button>
      <button id="export-level" type="button" class="primary" disabled>Export…</button>
      <span class="save-state" id="save-state" aria-live="polite"></span>
      <span class="spacer"></span>
      <button id="theme-toggle" type="button" class="icon-button" aria-label="Switch between dark and light" title="Switch between dark and light"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <button id="open-help" type="button" aria-label="Help" title="Help and shortcuts (?)">?</button>
    </div>
  </header>

  <main id="levels-pane" class="pane">
    <div class="tools" role="toolbar" aria-label="Editing tools">
      <span class="group" role="radiogroup" aria-label="Tool">
        <button type="button" data-tool="select" title="Select and move walls (V)">Select</button>
        <button type="button" data-tool="wall" title="Draw walls: drag for one, tap points to chain (W)">Wall</button>
        <button type="button" data-tool="shapes" title="Stamp a shape (S)">Shapes</button>
        <button type="button" data-tool="erase" title="Tap or drag over walls to remove them (E)">Erase</button>
      </span>
      <span class="group">
        <button id="undo" type="button" disabled title="Undo (Ctrl/Cmd+Z)">Undo</button>
        <button id="redo" type="button" disabled title="Redo (Ctrl/Cmd+Y)">Redo</button>
        <button id="delete" type="button" disabled title="Delete the selected walls (Delete)">Delete</button>
      </span>
      <span class="group" id="shape-options" hidden>
        <select id="shape-kind" aria-label="Shape"></select>
        <label class="inline" id="sides-label">Sides <input id="shape-sides" type="number" min="3" max="16" value="6"></label>
      </span>
      <span class="group">
        <button id="snap-grid" type="button" class="toggle" aria-pressed="true" title="Snap to a grid (G)">Grid</button>
        <select id="grid-size" aria-label="Grid size"></select>
        <button id="snap-ends" type="button" class="toggle" aria-pressed="true" title="Snap to other walls' ends, so corners close">Ends</button>
        <button id="snap-angle" type="button" class="toggle" aria-pressed="false" title="Angle snapping while drawing: off, 45 or 15 degrees">Angle: off</button>
      </span>
      <span class="group">
        <label class="inline" title="Everything you draw is repeated">Symmetry <select id="symmetry"></select></label>
      </span>
      <span class="group">
        <button id="show-space" type="button" class="toggle" aria-pressed="false" title="Tint where ships can fly (green) and closed-off pockets (red)">Space</button>
        <button id="show-ship" type="button" class="toggle" aria-pressed="false" title="Show a ship's size at the pointer">Ship size</button>
        <button id="add-select" type="button" class="toggle" aria-pressed="false" title="Tap adds to the selection instead of replacing it (for touch)">Add</button>
      </span>
      <span class="spacer"></span>
      <span class="group">
        <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
        <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
        <button id="zoom-fit" type="button">Fit</button>
      </span>
    </div>
    <div class="workspace">
      <div class="stage" id="stage">
        <canvas id="canvas" aria-label="The arena"></canvas>
        <div class="hint" id="hint" aria-live="polite"></div>
      </div>
      <aside class="side" id="side">
        <div class="side-tabs" role="tablist">
          <button type="button" role="tab" data-side="level" aria-selected="true">Arena</button>
          <button type="button" role="tab" data-side="selection" aria-selected="false">Selection</button>
          <button type="button" role="tab" data-side="checks" aria-selected="false">Checks</button>
        </div>
        <div class="side-body" id="side-level"></div>
        <div class="side-body" id="side-selection" hidden></div>
        <div class="side-body" id="side-checks" hidden></div>
      </aside>
    </div>
  </main>

  <main id="ships-pane" class="pane" hidden>
    <div class="tools" role="toolbar" aria-label="Ship editing tools">
      <span class="group" role="radiogroup" aria-label="Tool">
        <button type="button" data-ship-tool="move" title="Move points: drag one, tap to select (V)">Move</button>
        <button type="button" data-ship-tool="add" title="Add a point: tap the outline, then drag to place it (A)">Add</button>
        <button type="button" data-ship-tool="delete" title="Delete a point: tap it (X)">Delete</button>
        <button type="button" data-ship-tool="draw" title="Draw the outline freehand (F)">Draw</button>
        <button type="button" data-ship-tool="thruster" title="Place thrusters: tap to add a flame, drag to move it (T)">Thruster</button>
      </span>
      <span class="group">
        <button id="ship-undo" type="button" disabled title="Undo (Ctrl/Cmd+Z)">Undo</button>
        <button id="ship-redo" type="button" disabled title="Redo (Ctrl/Cmd+Y)">Redo</button>
        <button id="ship-delete" type="button" disabled title="Delete the selected point or thruster (Delete)">Delete</button>
      </span>
      <span class="group">
        <button id="ship-mirror" type="button" class="toggle" aria-pressed="true" title="Mirror: edit both sides of the ship at once (M)">Mirror</button>
        <label class="inline" title="Points snap to this grid">Snap <select id="ship-snap"></select></label>
      </span>
      <span class="group">
        <button id="ship-sym-right" type="button" title="Copy the right half of the outline onto the left, making it symmetrical">Right → left</button>
        <button id="ship-sym-left" type="button" title="Copy the left half of the outline onto the right, making it symmetrical">Left → right</button>
        <button id="ship-centre" type="button" title="Slide the outline so it is centred on the middle, where the ship turns">Centre</button>
        <button id="ship-smaller" type="button" title="Shrink by 10%">Smaller</button>
        <button id="ship-bigger" type="button" title="Grow by 10%">Bigger</button>
        <button id="ship-flip" type="button" title="Turn the ship upside down (nose to tail)">Flip ↕</button>
      </span>
      <span class="group">
        <label class="inline" title="Faint outlines of the ships that come with the game, to compare size">Compare <select id="ship-ghost"></select></label>
      </span>
      <span class="spacer"></span>
      <span class="group">
        <button id="ship-zoom-out" type="button" aria-label="Zoom out">−</button>
        <button id="ship-zoom-in" type="button" aria-label="Zoom in">+</button>
        <button id="ship-zoom-fit" type="button">Fit</button>
      </span>
    </div>
    <div class="workspace">
      <div class="stage">
        <canvas id="ship-canvas" aria-label="The ship outline"></canvas>
        <div class="hint" id="ship-hint" aria-live="polite"></div>
      </div>
      <aside class="side">
        <div class="side-tabs" role="tablist">
          <button type="button" role="tab" data-sside="ship" aria-selected="true">Ship</button>
          <button type="button" role="tab" data-sside="checks" aria-selected="false">Checks</button>
        </div>
        <div class="side-body" id="ship-side-ship"><canvas id="ship-preview" aria-label="A live preview of the ship flying" width="300" height="170"></canvas></div>
        <div class="side-body" id="ship-side-checks" hidden></div>
      </aside>
    </div>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
